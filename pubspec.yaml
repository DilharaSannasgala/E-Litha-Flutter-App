name: e_litha
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  awesome_notifications: ^0.10.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: AbhayaLibre
      fonts:
        - asset: assets/fonts/AbhayaLibre-Regular.ttf
        - asset: assets/fonts/AbhayaLibre-Medium.ttf
          weight: 500
        - asset: assets/fonts/AbhayaLibre-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AbhayaLibre-Bold.ttf
          weight: 700
        - asset: assets/fonts/AbhayaLibre-ExtraBold.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/calendar_data.json
    - assets/data/nakath_data.json
    - assets/data/event_data.json
    - assets/data/rashi_table.json
    - assets/data/rahukalaya_data.json
    - assets/data/annual_summary_data.json
    - assets/data/annual_predictions_data.json
    - assets/data/subha_dawasa_data.json